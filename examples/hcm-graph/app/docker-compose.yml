# Local-dev graph database for the HCM Core-HR slice.
# Stack-recommendation.md: "neo4j:5-community  # Bolt :7687, Browser :7474".
#
# THROWAWAY local dev database. The credentials below are a non-secret local
# default (never a production secret) and match app/server/src/db/driver.ts's
# configFromEnv default (user "neo4j" / password "password") — see .env.example.
# Bring it up with:  docker compose -f app/docker-compose.yml up -d
services:
  neo4j:
    image: neo4j:5-community
    container_name: hcm-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt (driver)
    environment:
      # user/password — matches driver.ts default + .env.example.
      NEO4J_AUTH: "neo4j/password"
      # Modest footprint for a ~200-node local graph.
      NEO4J_server_memory_pagecache_size: "512M"
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # Bolt is ready shortly after HTTP answers; the driver also retries.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  neo4j-data:
